spring:
  application:
    name: skala-shop-api

  ai:
    mcp:
      server:
        enabled: true
        name: skala-shop-mcp-server
        version: 1.0.0
        type: SYNC
        protocol: STREAMABLE
        annotation-scanner:
          enabled: true

  datasource:
    url: jdbc:h2:mem:shopdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    defer-datasource-initialization: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

#jwt:
  # 실습용 기본 키입니다. 운영 환경에서는 JWT_SECRET 환경 변수로 교체합니다.
  #secret: ${JWT_SECRET:U0tBTEEtU0hPUC1KV1QtU0VDUkVULUtFWS0yMDI2LUtFRVAtVEhJUy1TQUZFISE=}
  #expiration-minutes: 60

logging:
    level:
        root: info                 # 전체 기본 레벨: INFO 이상만 출력
        com.skala.skala_shop_api: DEBUG      # 우리 패키지만 DEBUG까지 출력 (개발용)
    file:
        name: logs/skala-shop-api.log  # 콘솔과 동시에 파일로도 기록 (logs 디렉터리 자동 생성)
